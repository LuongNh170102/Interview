<div class="container mx-auto px-4 py-8" *ngIf="!isLoading(); else loading">
  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
      <!-- Image -->
      <div>
        <img
          [src]="product()?.thumbnail || 'assets/placeholder.jpg'"
          [alt]="product()?.name"
          class="w-full rounded-2xl shadow-lg object-cover aspect-square"
        />
      </div>

      <!-- Info -->
      <div>
        <h1 class="text-3xl font-bold mb-4">{{ product()?.name }}</h1>
        <p class="text-4xl font-semibold text-green-600 mb-6">
          {{ product()?.price | number }} ₫
        </p>

        <div class="mb-8">
          <p class="text-gray-600 leading-relaxed">
            {{ product()?.description }}
          </p>
        </div>

        <!-- Quantity -->
        <div class="flex items-center gap-4 mb-8">
          <span class="font-medium">Số lượng:</span>
          <div class="flex items-center border border-gray-300 rounded-lg">
            <button
              (click)="decrement()"
              class="px-4 py-2 text-xl hover:bg-gray-100"
            >
              -
            </button>
            <span class="px-6 py-2 font-semibold">{{ quantity() }}</span>
            <button
              (click)="increment()"
              class="px-4 py-2 text-xl hover:bg-gray-100"
            >
              +
            </button>
          </div>
        </div>

        <button
          (click)="addToCart()"
          class="w-full bg-black text-white py-4 rounded-xl text-lg font-semibold hover:bg-gray-800 transition"
        >
          Thêm vào giỏ hàng
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="container mx-auto px-4 py-12">
    <div
      class="animate-pulse max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-10"
    >
      <div class="bg-gray-300 aspect-square rounded-2xl"></div>
      <div>
        <div class="h-8 bg-gray-300 rounded w-3/4 mb-4"></div>
        <div class="h-10 bg-gray-300 rounded w-1/3 mb-8"></div>
        <div class="space-y-3">
          <div class="h-4 bg-gray-300 rounded"></div>
          <div class="h-4 bg-gray-300 rounded w-5/6"></div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
