<div class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm px-4 py-3 flex items-center gap-3">
    <button (click)="goBack()" class="text-gray-600 hover:text-gray-800">← Quay lại</button>
    <h1 class="text-xl font-bold flex-1">Chi tiết sản phẩm</h1>
    <button (click)="goToCart()" class="px-4 py-2 bg-primary text-white rounded-lg text-sm">🛒 Giỏ hàng</button>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">
    @if (isLoading()) {
      <div class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
      </div>
    } @else if (product()) {
      <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="h-64 bg-gray-100 flex items-center justify-center text-8xl">🛍️</div>
        <div class="p-6">
          <h2 class="text-2xl font-bold text-gray-800">{{ getName() }}</h2>
          <p class="text-3xl font-bold text-primary mt-2">{{ product()!.price | number }} {{ product()!.currency ?? 'VND' }}</p>
          <p class="text-gray-600 mt-4">{{ getDescription() }}</p>
          <div class="mt-4 flex gap-4 text-sm text-gray-500">
            <span>SKU: {{ product()!.sku ?? '-' }}</span>
            <span>Tồn kho: {{ product()!.stock ?? '-' }}</span>
          </div>
          <button
            (click)="addToCart()"
            class="mt-6 w-full py-3 rounded-xl text-white font-semibold transition-all"
            [class.bg-green-500]="added()"
            [class.bg-primary]="!added()"
          >
            {{ added() ? '✓ Đã thêm vào giỏ!' : 'Thêm vào giỏ hàng' }}
          </button>
        </div>
      </div>
    }
  </main>
</div>
