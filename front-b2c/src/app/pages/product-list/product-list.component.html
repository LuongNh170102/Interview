<div class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center">
    <h1 class="text-xl font-bold">Cửa hàng</h1>
    <button (click)="goToCart()" class="relative px-4 py-2 bg-primary text-white rounded-lg text-sm">
      🛒 Giỏ hàng
      @if (cartCount() > 0) {
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{{ cartCount() }}</span>
      }
    </button>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    @if (isLoading()) {
      <div class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        @for (product of products(); track product.externalId) {
          <div class="bg-white rounded-xl shadow-sm overflow-hidden cursor-pointer hover:shadow-md transition-shadow" (click)="goToDetail(product)">
            <div class="h-40 bg-gray-100 flex items-center justify-center text-4xl">🛍️</div>
            <div class="p-4">
              <h3 class="font-semibold text-gray-800 truncate">{{ getName(product) }}</h3>
              <p class="text-primary font-bold mt-1">{{ product.price | number }} {{ product.currency ?? 'VND' }}</p>
              <button
                (click)="addToCart(product, $event)"
                class="mt-3 w-full py-2 bg-primary text-white rounded-lg text-sm hover:opacity-90 transition-opacity"
              >
                Thêm vào giỏ
              </button>
            </div>
          </div>
        }
      </div>
      @if (products().length === 0) {
        <p class="text-center text-gray-500 py-20">Không có sản phẩm nào.</p>
      }
    }
  </main>
</div>
