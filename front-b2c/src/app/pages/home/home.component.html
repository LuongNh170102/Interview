<div class="min-h-screen">
  <div class="bg-black text-white py-20 text-center">
    <h1 class="text-5xl font-bold mb-4">VHan Delivery</h1>
    <p class="text-xl">Giao hàng nhanh - Đồ ăn ngon mỗi ngày</p>
  </div>

  <div class="container mx-auto px-4 py-12">
    <h2 class="text-3xl font-bold mb-8">Sản phẩm nổi bật</h2>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @for (p of featuredProducts(); track p.externalId) {
      <a
        [routerLink]="['/products', p.externalId]"
        class="block border rounded-2xl overflow-hidden hover:shadow-xl transition"
      >
        <img
          [src]="p.thumbnail"
          [alt]="p.name"
          class="w-full aspect-square object-cover"
        />
        <div class="p-4">
          <h3 class="font-medium line-clamp-2">{{ p.name }}</h3>
          <p class="text-lg font-semibold mt-2">{{ p.price | number }} ₫</p>
        </div>
      </a>
      }
    </div>

    <div class="text-center mt-12">
      <a
        routerLink="/products"
        class="inline-block bg-black text-white px-10 py-4 rounded-xl text-lg"
      >
        Xem tất cả sản phẩm
      </a>
    </div>
  </div>
</div>
