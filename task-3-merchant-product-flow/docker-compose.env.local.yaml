version: '3.9'
networks:
  app_network:
    driver: bridge
services:
  postgresdb:
    container_name: my_merchant_env_local_postgres
    build:
      context: ./stack-backend
      dockerfile: env-local-database.Dockerfile
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=merchant439156
      - POSTGRES_DATABASE=merchant
    ports:
      - 5844:5432
    networks:
      - app_network
    volumes:
      - saved_data:/var/lib/postgresql/data
      - ./database:/database
    restart: always
volumes:
  saved_data:
